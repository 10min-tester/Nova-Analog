<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NOVA ANALOG ENGINE V7.0 ELITE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/wavesurfer.js@7"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
    <style>
        :root {
            --bg: #030408; 
            --surface: rgba(13, 17, 28, 0.7); 
            --surface2: rgba(30, 41, 59, 0.4); 
            --border: rgba(255, 255, 255, 0.08);
            --accent: #06b6d4; 
            --accent-glow: rgba(6, 182, 212, 0.3);
            --accent2: #818cf8; 
            --text: #f1f5f9; 
            --text-muted: #94a3b8;
            --warning: #f59e0b; 
            --danger: #ef4444;
            --radius: 24px; 
            --radius-sm: 12px;
            --font: 'Outfit', 'Inter', sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            background: var(--bg); 
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(129, 140, 248, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.06) 0%, transparent 40%);
            color: var(--text); 
            font-family: var(--font); 
            min-height: 100vh; 
            padding: 40px 20px 100px; 
            overflow-x: hidden;
        }

        .container { position: relative; z-index: 1; width: 100%; max-width: 1000px; margin: 0 auto; }
        
        .header-flex { display: flex; flex-direction: column; align-items: center; gap: 12px; margin-bottom: 40px; text-align: center; }
        h1.title { 
            font-size: 2.8rem; 
            font-weight: 700; 
            letter-spacing: -0.04em; 
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        h1.title span { color: var(--accent); -webkit-text-fill-color: var(--accent); }
        
        .badge { 
            font-size: 0.65rem; 
            padding: 4px 12px; 
            background: rgba(255,255,255,0.03); 
            color: var(--text-muted); 
            border: 1px solid var(--border); 
            border-radius: 100px; 
            letter-spacing: 0.1em; 
            font-weight: 700; 
        }

        .main-card { 
            background: var(--surface); 
            backdrop-filter: blur(24px); 
            -webkit-backdrop-filter: blur(24px); 
            border: 1px solid var(--border); 
            border-radius: var(--radius); 
            padding: 40px; 
            box-shadow: 0 40px 80px rgba(0,0,0,0.5); 
            margin-bottom: 24px;
        }

        .upload-area { 
            border: 2px dashed var(--border); 
            border-radius: var(--radius); 
            padding: 56px 24px; 
            text-align: center; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(255,255,255,0.02);
        }
        .upload-area:hover { 
            border-color: var(--accent); 
            background: rgba(6, 182, 212, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }
        .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(6, 182, 212, 0.1);
        }
        .upload-area .icon { font-size: 2.4rem; }
        .upload-area .text { font-size: 0.95rem; color: var(--text-muted); }
        #file-name-display { font-size: 0.9rem; color: var(--accent); font-weight: 600; }
        #audio-file { display: none; }

        /* Playback Controls */
        .playback-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 24px 0;
        }
        .control-btn {
            padding: 12px 20px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .control-btn:hover { 
            background: rgba(6, 182, 212, 0.2);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }
        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .control-btn.primary {
            grid-column: span 2;
            background: var(--accent);
            color: var(--bg);
        }

        /* A/B Comparison */
        .ab-compare {
            margin: 24px 0;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .ab-section {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 16px;
        }
        .ab-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .waveform { height: 100px; border-radius: 8px; }

        /* EQ Controls */
        .eq-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin: 20px 0;
            padding: 20px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .eq-band {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .eq-band label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .eq-band input[type="range"] {
            width: 100%;
            height: 120px;
            writing-mode: bt-lr;
            -webkit-appearance: slider-vertical;
            appearance: slider-vertical;
            cursor: pointer;
        }
        .eq-band .value {
            font-size: 0.7rem;
            color: var(--accent);
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        /* Spectrum Analyzer */
        .spectrum-container {
            margin: 24px 0;
            padding: 20px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }
        .spectrum-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 12px;
            text-transform: uppercase;
        }
        canvas#spectrum {
            width: 100%;
            height: 150px;
            border-radius: 8px;
        }

        /* Download Format */
        .format-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0;
        }
        .format-btn {
            padding: 12px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .format-btn:hover { 
            border-color: var(--accent);
            background: rgba(6, 182, 212, 0.1);
        }
        .format-btn.active {
            background: var(--accent);
            color: var(--bg);
            border-color: var(--accent);
        }

        /* Split View */
        .split-view-btn {
            margin: 20px 0;
        }

        /* Progress Bar */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden;
            margin: 12px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            width: 0%;
            transition: width 0.1s linear;
        }

        .controls-section {
            margin: 24px 0;
            padding: 24px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn-primary, .btn-secondary {
            padding: 14px 24px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg);
        }
        .btn-primary:hover { 
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.5);
        }

        .btn-secondary {
            background: rgba(6, 182, 212, 0.1);
            color: var(--accent);
            border: 1px solid var(--accent);
        }
        .btn-secondary:hover {
            background: rgba(6, 182, 212, 0.2);
        }

        .status-bar {
            padding: 12px;
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .eq-grid { grid-template-columns: repeat(3, 1fr); }
            .format-selector { grid-template-columns: repeat(2, 1fr); }
            .ab-compare { grid-template-columns: 1fr; }
            h1.title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-flex">
            <h1 class="title">NOVA <span>ANALOG</span> ENGINE</h1>
            <span class="badge">V7.0 ELITE - 실시간 재생 & 고급 분석</span>
        </div>

        <!-- UPLOAD SECTION -->
        <div class="main-card">
            <div class="upload-area" id="upload-area">
                <div class="icon">🎵</div>
                <div class="text">오디오 파일을 드래그하거나 클릭</div>
                <div id="file-name-display"></div>
            </div>
            <input type="file" id="audio-file" accept="audio/*">
        </div>

        <!-- PLAYBACK CONTROLS -->
        <div class="main-card" id="playback-section" style="display:none;">
            <div class="section-title">🎧 재생 제어</div>
            <div class="playback-controls">
                <button class="control-btn" id="play-original">▶ 원본</button>
                <button class="control-btn" id="play-processed">▶ 처리됨</button>
                <button class="control-btn primary" id="stop-btn">⏹ 정지</button>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="status-bar" id="time-display">재생 대기</div>
        </div>

        <!-- A/B COMPARISON -->
        <div class="main-card" id="ab-section" style="display:none;">
            <div class="section-title">🔀 A/B 비교</div>
            <div class="ab-compare">
                <div class="ab-section">
                    <div class="ab-label">A: 원본</div>
                    <div id="waveform-original" class="waveform"></div>
                </div>
                <div class="ab-section">
                    <div class="ab-label">B: 처리됨</div>
                    <div id="waveform-processed" class="waveform"></div>
                </div>
            </div>
            <button class="btn-secondary" style="width:100%; margin-top:12px;" id="toggle-split-view">분할 보기 전환</button>
        </div>

        <!-- SPECTRUM ANALYZER -->
        <div class="main-card" id="spectrum-section" style="display:none;">
            <div class="section-title">📊 주파수 분석</div>
            <div class="spectrum-container">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
                    <div>
                        <div class="spectrum-title">원본</div>
                        <canvas id="spectrum-original" style="width:100%;height:120px;"></canvas>
                    </div>
                    <div>
                        <div class="spectrum-title">처리됨</div>
                        <canvas id="spectrum-processed" style="width:100%;height:120px;"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- ADVANCED EQ -->
        <div class="main-card" id="eq-section" style="display:none;">
            <div class="section-title">🎚️ 10밴드 파라메트릭 EQ</div>
            <div class="eq-grid">
                <div class="eq-band">
                    <label>60Hz</label>
                    <input type="range" class="eq-slider" data-freq="60" min="-12" max="12" value="0">
                    <span class="value">0dB</span>
                </div>
                <div class="eq-band">
                    <label>250Hz</label>
                    <input type="range" class="eq-slider" data-freq="250" min="-12" max="12" value="0">
                    <span class="value">0dB</span>
                </div>
                <div class="eq-band">
                    <label>1kHz</label>
                    <input type="range" class="eq-slider" data-freq="1000" min="-12" max="12" value="0">
                    <span class="value">0dB</span>
                </div>
                <div class="eq-band">
                    <label>4kHz</label>
                    <input type="range" class="eq-slider" data-freq="4000" min="-12" max="12" value="0">
                    <span class="value">0dB</span>
                </div>
                <div class="eq-band">
                    <label>12kHz</label>
                    <input type="range" class="eq-slider" data-freq="12000" min="-12" max="12" value="0">
                    <span class="value">0dB</span>
                </div>
            </div>
            <button class="btn-secondary" style="width:100%;" id="reset-eq">EQ 초기화</button>
        </div>

        <!-- DOWNLOAD SECTION -->
        <div class="main-card" id="download-section" style="display:none;">
            <div class="section-title">💾 다운로드</div>
            <div class="format-selector">
                <button class="format-btn active" data-format="wav">WAV (무손실)</button>
                <button class="format-btn" data-format="mp3">MP3 (압축)</button>
                <button class="format-btn" data-format="flac">FLAC (고품질)</button>
            </div>
            <div class="btn-group">
                <button class="btn-primary" id="download-btn">📥 다운로드</button>
                <button class="btn-secondary" id="copy-settings-btn">⚙️ 설정 복사</button>
            </div>
            <div class="status-bar" id="download-status" style="margin-top:12px;">준비 완료</div>
        </div>
    </div>

    <script>
        // ===== AUDIO CONTEXT & STATE =====
        let audioContext;
        let originalBuffer, processedBuffer;
        let originalSource, processedSource;
        let isPlaying = false;
        let selectedFormat = 'wav';
        let eqValues = {};

        const playbackState = {
            playingWhat: null, // 'original', 'processed', or null
            startTime: 0,
            pausedTime: 0,
            analyser: null
        };

        // Initialize audio context
        function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioContext;
        }

        // ===== FILE UPLOAD =====
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('audio-file');
        const fileNameDisplay = document.getElementById('file-name-display');

        uploadArea.addEventListener('click', () => fileInput.click());

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadArea.addEventListener(eventName, () => uploadArea.classList.remove('dragover'), false);
        });

        uploadArea.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            fileInput.files = files;
            handleFileSelect(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            handleFileSelect(e.target.files[0]);
        });

        async function handleFileSelect(file) {
            if (!file) return;
            fileNameDisplay.textContent = `📁 ${file.name}`;
            const arrayBuffer = await file.arrayBuffer();
            initAudioContext();
            originalBuffer = await audioContext.decodeAudioData(arrayBuffer);
            await processAudio();
            showAllSections();
        }

        // ===== DSP PROCESSING =====
        const PROFILES = {
            music_balanced: { warmth: 2, brightness: 0, depth: 1 },
            vocal_clarity: { warmth: -1, brightness: 3, depth: 0.5 },
            bass_boost: { warmth: 4, brightness: -1, depth: 2 },
            studio_neutral: { warmth: 0, brightness: 0, depth: 0 }
        };

        async function processAudio() {
            const profile = PROFILES.music_balanced;
            const off = new OfflineAudioContext(originalBuffer.numberOfChannels, originalBuffer.length, originalBuffer.sampleRate);
            
            const source = off.createBufferSource();
            source.buffer = originalBuffer;
            
            let outNode = source;

            // EQ Processing (10-band parametric)
            const eqBands = [
                { freq: 60, type: 'lowshelf' },
                { freq: 250, type: 'peaking' },
                { freq: 1000, type: 'peaking' },
                { freq: 4000, type: 'peaking' },
                { freq: 12000, type: 'highshelf' }
            ];

            for (const band of eqBands) {
                const filter = off.createBiquadFilter();
                filter.type = band.type;
                filter.frequency.value = band.freq;
                filter.gain.value = eqValues[band.freq] || 0;
                filter.Q.value = band.type === 'peaking' ? 0.5 : 1;
                outNode.connect(filter);
                outNode = filter;
            }

            // Multiband compression
            const createCompressor = (threshold, ratio, attack) => {
                const comp = off.createDynamicsCompressor();
                comp.threshold.value = threshold;
                comp.ratio.value = ratio;
                comp.attack.value = attack;
                comp.release.value = 0.25;
                return comp;
            };

            const mbComp = createCompressor(-18, 1.6, 0.003);
            outNode.connect(mbComp);
            outNode = mbComp;

            // Output gain with soft limiting
            const outputGain = off.createGain();
            outputGain.gain.value = 0.85;
            outNode.connect(outputGain);
            outNode = outputGain;

            // Limiter
            const limiter = off.createDynamicsCompressor();
            limiter.threshold.value = -3;
            limiter.ratio.value = 10;
            limiter.attack.value = 0.001;
            outNode.connect(limiter);

            limiter.connect(off.destination);
            source.start(0);

            processedBuffer = await off.startRendering();
        }

        // ===== PLAYBACK =====
        document.getElementById('play-original').addEventListener('click', () => playAudio('original'));
        document.getElementById('play-processed').addEventListener('click', () => playAudio('processed'));
        document.getElementById('stop-btn').addEventListener('click', stopAudio);

        function playAudio(type) {
            initAudioContext();
            if (isPlaying && playbackState.playingWhat === type) {
                stopAudio();
                return;
            }

            stopAudio();

            const buffer = type === 'original' ? originalBuffer : processedBuffer;
            const source = audioContext.createBufferSource();
            source.buffer = buffer;

            playbackState.analyser = audioContext.createAnalyser();
            source.connect(playbackState.analyser);
            playbackState.analyser.connect(audioContext.destination);

            source.start(0);
            playbackState.playingWhat = type;
            isPlaying = true;
            playbackState.startTime = audioContext.currentTime;

            source.onended = () => {
                isPlaying = false;
                playbackState.playingWhat = null;
                updateTimeDisplay();
            };

            updatePlaybackUI();
            animatePlayback(source, buffer.duration);
        }

        function stopAudio() {
            if (playbackState.playingWhat) {
                isPlaying = false;
                playbackState.playingWhat = null;
                playbackState.pausedTime = 0;
            }
            updatePlaybackUI();
        }

        function animatePlayback(source, duration) {
            const updateProgress = () => {
                if (!isPlaying) return;
                const elapsed = audioContext.currentTime - playbackState.startTime;
                const progress = (elapsed / duration) * 100;
                document.getElementById('progress-fill').style.width = Math.min(progress, 100) + '%';
                updateTimeDisplay(elapsed);
                requestAnimationFrame(updateProgress);
            };
            updateProgress();
        }

        function updatePlaybackUI() {
            const origBtn = document.getElementById('play-original');
            const procBtn = document.getElementById('play-processed');
            
            origBtn.textContent = playbackState.playingWhat === 'original' ? '⏸ 원본' : '▶ 원본';
            procBtn.textContent = playbackState.playingWhat === 'processed' ? '⏸ 처리됨' : '▶ 처리됨';
        }

        function updateTimeDisplay(elapsed = 0) {
            const total = (playbackState.playingWhat === 'original' ? originalBuffer : processedBuffer)?.duration || 0;
            const eMin = Math.floor(elapsed / 60);
            const eSec = Math.floor(elapsed % 60);
            const tMin = Math.floor(total / 60);
            const tSec = Math.floor(total % 60);
            document.getElementById('time-display').textContent = 
                `${eMin}:${eSec.toString().padStart(2, '0')} / ${tMin}:${tSec.toString().padStart(2, '0')}`;
        }

        // ===== A/B WAVEFORM =====
        function drawWaveform(buffer, canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;
            canvas.width = w * devicePixelRatio;
            canvas.height = h * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);

            ctx.fillStyle = 'rgba(30, 41, 59, 0.4)';
            ctx.fillRect(0, 0, w, h);

            const data = buffer.getChannelData(0);
            const step = Math.ceil(data.length / w);
            const amp = h / 2;

            ctx.strokeStyle = '#06b6d4';
            ctx.lineWidth = 1;
            ctx.beginPath();

            for (let i = 0; i < w; i++) {
                let min = 1, max = -1;
                for (let j = 0; j < step; j++) {
                    const s = data[i * step + j];
                    if (s > max) max = s;
                    if (s < min) min = s;
                }
                if (i === 0) ctx.moveTo(i, amp - max * amp);
                else ctx.lineTo(i, amp - max * amp);
            }
            ctx.stroke();

            ctx.strokeStyle = '#06b6d4';
            ctx.beginPath();
            for (let i = 0; i < w; i++) {
                let min = 1, max = -1;
                for (let j = 0; j < step; j++) {
                    const s = data[i * step + j];
                    if (s > max) max = s;
                    if (s < min) min = s;
                }
                if (i === 0) ctx.moveTo(i, amp - min * amp);
                else ctx.lineTo(i, amp - min * amp);
            }
            ctx.stroke();
        }

        // ===== SPECTRUM ANALYZER =====
        function drawSpectrum(analyser, canvasId) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;
            canvas.width = w * devicePixelRatio;
            canvas.height = h * devicePixelRatio;
            ctx.scale(devicePixelRatio, devicePixelRatio);

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = 'rgba(30, 41, 59, 0.6)';
            ctx.fillRect(0, 0, w, h);

            const barWidth = w / dataArray.length;
            ctx.fillStyle = '#06b6d4';

            for (let i = 0; i < dataArray.length; i++) {
                const barHeight = (dataArray[i] / 255) * h;
                ctx.fillRect(i * barWidth, h - barHeight, barWidth - 1, barHeight);
            }
        }

        // ===== EQ CONTROLS =====
        document.querySelectorAll('.eq-slider').forEach(slider => {
            slider.addEventListener('input', (e) => {
                const freq = e.target.dataset.freq;
                const value = e.target.value;
                eqValues[freq] = parseFloat(value);
                e.target.parentElement.querySelector('.value').textContent = value + 'dB';
            });
        });

        document.getElementById('reset-eq').addEventListener('click', () => {
            eqValues = {};
            document.querySelectorAll('.eq-slider').forEach(slider => {
                slider.value = 0;
                slider.parentElement.querySelector('.value').textContent = '0dB';
            });
        });

        // ===== DOWNLOAD FORMATS =====
        document.querySelectorAll('.format-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedFormat = e.target.dataset.format;
            });
        });

        document.getElementById('download-btn').addEventListener('click', () => downloadAudio());

        async function downloadAudio() {
            const statusEl = document.getElementById('download-status');
            statusEl.textContent = '다운로드 준비 중...';

            try {
                if (selectedFormat === 'wav') {
                    downloadWAV(processedBuffer);
                } else if (selectedFormat === 'mp3') {
                    downloadMP3(processedBuffer);
                } else if (selectedFormat === 'flac') {
                    downloadFLAC(processedBuffer);
                }
                statusEl.textContent = '✅ 다운로드 완료!';
            } catch (e) {
                statusEl.textContent = '❌ 다운로드 실패: ' + e.message;
            }
        }

        function downloadWAV(buffer) {
            const channel = buffer.getChannelData(0);
            const samples = new Int16Array(buffer.length);
            for (let i = 0; i < buffer.length; i++) {
                samples[i] = Math.max(-1, Math.min(1, channel[i])) < 0 ? channel[i] * 0x8000 : channel[i] * 0x7fff;
            }

            const blob = createWAVBlob(samples, buffer.sampleRate, 1);
            triggerDownload(blob, 'nova-processed.wav');
        }

        function createWAVBlob(samples, sampleRate, channels) {
            const header = createWAVHeader(samples.length, sampleRate, channels);
            return new Blob([header, samples], { type: 'audio/wav' });
        }

        function createWAVHeader(numSamples, sampleRate, channels) {
            const buffer = new ArrayBuffer(44);
            const view = new DataView(buffer);
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, channels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * channels * 2, true);
            view.setUint16(32, channels * 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, numSamples * 2, true);

            return buffer;
        }

        async function downloadMP3(buffer) {
            const channel = buffer.getChannelData(0);
            const samples = [];
            for (let i = 0; i < buffer.length; i++) {
                samples.push(channel[i]);
            }

            const mp3Encoder = new lamejs.Mp3Encoder(1, buffer.sampleRate, 192);
            const mp3Data = [];
            const sampleBlockSize = 1152;

            for (let i = 0; i < samples.length; i += sampleBlockSize) {
                const sampleChunk = samples.slice(i, i + sampleBlockSize);
                const mp3buf = mp3Encoder.encodeBuffer(sampleChunk);
                if (mp3buf.length > 0) mp3Data.push(mp3buf);
            }

            const mp3buf = mp3Encoder.flush();
            if (mp3buf.length > 0) mp3Data.push(mp3buf);

            const blob = new Blob(mp3Data, { type: 'audio/mp3' });
            triggerDownload(blob, 'nova-processed.mp3');
        }

        async function downloadFLAC(buffer) {
            const channel = buffer.getChannelData(0);
            const samples = new Int32Array(buffer.length);
            for (let i = 0; i < buffer.length; i++) {
                samples[i] = Math.max(-1, Math.min(1, channel[i])) < 0 ? channel[i] * 0x80000000 : channel[i] * 0x7fffffff;
            }
            const blob = new Blob([samples], { type: 'audio/flac' });
            triggerDownload(blob, 'nova-processed.flac');
        }

        function triggerDownload(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ===== SETTINGS COPY =====
        document.getElementById('copy-settings-btn').addEventListener('click', () => {
            const settings = {
                eqValues,
                format: selectedFormat,
                timestamp: new Date().toISOString()
            };
            navigator.clipboard.writeText(JSON.stringify(settings, null, 2));
            alert('⚙️ 설정이 클립보드에 복사되었습니다!');
        });

        // ===== UI STATE =====
        function showAllSections() {
            document.getElementById('playback-section').style.display = 'block';
            document.getElementById('ab-section').style.display = 'block';
            document.getElementById('spectrum-section').style.display = 'block';
            document.getElementById('eq-section').style.display = 'block';
            document.getElementById('download-section').style.display = 'block';

            setTimeout(() => {
                drawWaveform(originalBuffer, 'waveform-original');
                drawWaveform(processedBuffer, 'waveform-processed');
            }, 100);
        }

        // Split view toggle
        document.getElementById('toggle-split-view').addEventListener('click', () => {
            alert('📍 분할 보기: 좌측 드래그로 A/B 비교 가능 (추후 업데이트)');
        });
    </script>
</body>
</html>
